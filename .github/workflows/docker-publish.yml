name: Docker

on:
  schedule:
    - cron: '30 19 * * 0'
  push:
    branches: [ "master", "test-publish/**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Create a GitHub Release from the default branch after all tests pass
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      publish: ${{ steps.plan.outputs.publish }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      bases: ${{ steps.plan.outputs.bases }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Plan build and release
        id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_STABLE: ${{ inputs.publish_stable }}
        run: bash .github/scripts/plan-images.sh

  verify:
    needs: prepare
    if: needs.prepare.outputs.verify == 'true'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [centos, microsoft, ubuntu, azurelinux4]
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        include:
          - variant: centos
            dockerfile: Dockerfile
          - variant: microsoft
            dockerfile: Dockerfile-microsoft
          - variant: ubuntu
            dockerfile: Dockerfile-ubuntu
          - variant: azurelinux4
            dockerfile: Dockerfile-azurelinux4
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: debug-container:verify
          build-args: BASE_IMAGE=${{ fromJSON(needs.prepare.outputs.bases)[matrix.dockerfile] }}
          no-cache: ${{ needs.prepare.outputs.publish == 'true' }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform.arch }}

      - name: Smoke test native image
        run: bash .github/scripts/smoke-test-image.sh debug-container:verify "$VARIANT" "$ARCH"
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.platform.arch }}

  build:
    needs: [prepare, verify]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            variant: centos
          - dockerfile: Dockerfile-microsoft
            variant: microsoft
          - dockerfile: Dockerfile-ubuntu
            variant: ubuntu
          - dockerfile: Dockerfile-azurelinux4
            variant: azurelinux4
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: 'v3.0.6'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=test-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BASE_IMAGE=${{ fromJSON(needs.prepare.outputs.bases)[matrix.dockerfile] }}
          no-cache: true
          platforms: linux/amd64,linux/arm64

      - name: Verify published image index
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] |
              sort == ["amd64", "arm64"]'

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: stable-images-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc62663121 # v4.1.0
        if: needs.prepare.outputs.release == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record changes and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.release }}
          BASES: ${{ needs.prepare.outputs.bases }}
        run: bash .github/scripts/release-images.sh
